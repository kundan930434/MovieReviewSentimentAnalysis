<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Review Sentiment Analysis</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(135deg,#141e30,#243b55);
        }

        .container{
            width:500px;
            background:white;
            padding:30px;
            border-radius:20px;
            box-shadow:0px 10px 30px rgba(0,0,0,0.4);
            text-align:center;
        }

        h1{
            color:#243b55;
            margin-bottom:10px;
            font-size:32px;
        }

        p{
            color:gray;
            margin-bottom:20px;
        }

        textarea{
            width:100%;
            height:180px;
            border:none;
            outline:none;
            padding:15px;
            border-radius:12px;
            resize:none;
            font-size:16px;
            background:#f1f1f1;
            margin-bottom:20px;
        }

        textarea:focus{
            border:2px solid #243b55;
            background:white;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:#243b55;
            color:white;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#141e30;
            transform:scale(1.03);
        }

        .result{
            margin-top:25px;
            padding:15px;
            border-radius:10px;
            font-size:22px;
            font-weight:bold;
            color:white;
            background:linear-gradient(135deg,#11998e,#38ef7d);
        }

        .footer{
            margin-top:20px;
            font-size:14px;
            color:gray;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>🎬 Movie Review Sentiment Analysis</h1>

        <p>
            Enter a movie review and predict whether the sentiment is
            Positive 😊 or Negative 😞
        </p>

        <form action="/predict" method="POST">

            <textarea
                name="review"
                placeholder="Type your movie review here..."></textarea>

            <button type="submit">
                Predict Sentiment
            </button>

        </form>

        {% if prediction_text %}

        <div class="result">

            {{ prediction_text }}

        </div>

        {% endif %}

        <div class="footer">
            NLP + Machine Learning Project using Flask
        </div>

    </div>

</body>

</html>
